name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  # ── Linux: .deb + portable tarball ──
  linux:
    # Pinned to the image ci.yml builds and tests on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*project\(F2Dock[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt)
          ARCH=$(uname -m)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      # Dependencies come from cvcpkg only — see .github/actions/cvcpkg-deps.
      - name: Provision dependencies (cvcpkg)
        id: deps
        uses: ./.github/actions/cvcpkg-deps
        with:
          build_type: Release
          link: shared

      # No dpkg-dev from apt: CPack's DEB generator writes the archive itself
      # and needs only the base image's dpkg.

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DF2DOCK_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # Portable tarball (statically-linked where practical)
      - name: Create portable tarball
        run: |
          cmake --install build --prefix staging/F2Dock
          # Bundle every shared library the binaries resolve from the cvcpkg
          # prefix (libcvc and its closure) next to them; system libraries
          # stay the system's. This used to match libfftw only, which the
          # default PocketFFT build no longer links.
          deps="${{ steps.deps.outputs.prefix }}"
          mkdir -p staging/F2Dock/lib
          for bin in staging/F2Dock/bin/*; do
            ldd "$bin" 2>/dev/null | awk -v p="$deps/" '$3 ~ "^"p {print $3}' | while read lib; do
              cp -uL "$lib" staging/F2Dock/lib/
            done
          done
          # Create a wrapper script that sets LD_LIBRARY_PATH
          for bin in staging/F2Dock/bin/*; do
            name=$(basename "$bin")
            mv "$bin" "$bin.real"
            cat > "$bin" <<'WRAPPER'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$DIR/BINNAME.real" "$@"
          WRAPPER
            sed -i "s/BINNAME/$name/" "$bin"
            chmod +x "$bin"
          done
          # Third-party licence texts for the libraries bundled above, from each
          # cvcpkg package's share/licenses/<name>/, plus a README of package,
          # version and licence. Report-only until the closure is republished
          # with cy-pca/cvcpkg#576; then --require makes a gap a red job.
          python .github/scripts/bundle-licences.py "$deps" staging/F2Dock/licenses \
            --libs staging/F2Dock/lib
          tar -czf "F2Dock-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}.tar.gz" -C staging F2Dock

      # Copy README into staging for the .deb as well
      - name: Copy docs into install
        run: cp README.md staging/F2Dock/

      # .deb package via CPack
      - name: Build .deb package
        run: |
          cd build
          cpack -G DEB
          for f in *.deb; do cp "$f" "../F2Dock-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}.deb"; done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            F2Dock-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}.tar.gz
            F2Dock-${{ steps.meta.outputs.version }}-linux-${{ steps.meta.outputs.arch }}.deb

  # ── macOS: .dmg ──
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact metadata
        id: meta
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*project\(F2Dock[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt)
          ARCH=$(uname -m)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      # Dependencies come from cvcpkg only — see .github/actions/cvcpkg-deps.
      - name: Provision dependencies (cvcpkg)
        id: deps
        uses: ./.github/actions/cvcpkg-deps
        with:
          build_type: Release
          link: shared

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DF2DOCK_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Create .dmg
        run: |
          cmake --install build --prefix staging/F2Dock.app/Contents/Resources
          mkdir -p staging/F2Dock.app/Contents/MacOS

          # Move (not copy) the binaries into the MacOS dir, then bundle every
          # non-OS dylib they load from the cvcpkg prefix and check nothing
          # leads outside the bundle. Same steps as ci.yml's package-macos.
          mv staging/F2Dock.app/Contents/Resources/bin/* \
             staging/F2Dock.app/Contents/MacOS/
          rmdir staging/F2Dock.app/Contents/Resources/bin
          bash .github/scripts/macos-bundle-app.sh staging/F2Dock.app "${{ steps.deps.outputs.prefix }}"
          bash .github/scripts/macos-check-app.sh staging/F2Dock.app
          # Third-party licence texts for the libraries bundled above, from each
          # cvcpkg package's share/licenses/<name>/, plus a README of package,
          # version and licence. Report-only until the closure is republished
          # with cy-pca/cvcpkg#576; then --require makes a gap a red job.
          python .github/scripts/bundle-licences.py "${{ steps.deps.outputs.prefix }}" \
            staging/F2Dock.app/Contents/Resources/licenses \
            --libs staging/F2Dock.app/Contents/Frameworks

          # Create the DMG
          cp README.md staging/F2Dock.app/Contents/Resources/
          ditto -c -k --keepParent staging/F2Dock.app "F2Dock-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}.zip"
          hdiutil create -volname F2Dock \
            -srcfolder staging/F2Dock.app \
            -ov -format UDZO \
            F2Dock-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}.dmg

      - name: Check the .zip runs without the build's prefix
        run: |
          set -euo pipefail
          deps="${{ steps.deps.outputs.prefix }}"
          check="$RUNNER_TEMP/zip-check"
          rm -rf "$check"
          mkdir -p "$check"
          ditto -x -k "F2Dock-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}.zip" "$check"
          mv "$deps" "$deps.hidden"
          trap 'mv "$deps.hidden" "$deps"' EXIT
          bash .github/scripts/macos-check-app.sh "$check/F2Dock.app" --run

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            F2Dock-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}.dmg
            F2Dock-${{ steps.meta.outputs.version }}-macos-${{ steps.meta.outputs.arch }}.zip

  # ── Windows: .zip ──
  windows:
    # windows-2022 (VS2022, v143): the toolchain the cvcpkg bundles are built
    # with. windows-latest's VS2026 CL.exe ICEs on libcvc's C++20 headers.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*project\(F2Dock[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=x64" >> "$GITHUB_OUTPUT"

      # Dependencies come from cvcpkg only — see .github/actions/cvcpkg-deps.
      - name: Provision dependencies (cvcpkg)
        id: deps
        uses: ./.github/actions/cvcpkg-deps
        with:
          build_type: Release
          link: shared

      - name: Configure
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DF2DOCK_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create zip
        shell: bash
        run: |
          cmake --install build --config Release --prefix staging/F2Dock

          # Bundle the cvcpkg prefix's runtime DLLs alongside the executables
          cp "${{ steps.deps.outputs.prefix }}"/bin/*.dll \
             staging/F2Dock/bin/ 2>/dev/null || true
          # Third-party licence texts for the libraries bundled above, from each
          # cvcpkg package's share/licenses/<name>/, plus a README of package,
          # version and licence. Report-only until the closure is republished
          # with cy-pca/cvcpkg#576; then --require makes a gap a red job.
          python .github/scripts/bundle-licences.py "${{ steps.deps.outputs.prefix }}" \
            staging/F2Dock/licenses --libs staging/F2Dock/bin

          cp README.md LICENSE staging/F2Dock/

          cd staging
          7z a -tzip ../F2Dock-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}.zip F2Dock/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: F2Dock-${{ steps.meta.outputs.version }}-windows-${{ steps.meta.outputs.arch }}.zip

  # ── Create GitHub Release ──
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
