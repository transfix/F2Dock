name: CI/CD

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: clang-format (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Determine merge base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run git-clang-format on changed lines
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.base }}"
          out=$(git clang-format --diff "$base" -- \
                  '*.c' '*.cc' '*.cpp' '*.cxx' \
                  '*.h' '*.hh' '*.hpp' '*.hxx' || true)
          if [ -z "$out" ] \
             || [ "$out" = "no modified files to format" ] \
             || [ "$out" = "clang-format did not modify any files" ]; then
            echo "Formatting OK on changed lines."
            exit 0
          fi
          echo "::error::clang-format would reformat changed lines. To apply:"
          echo "  git clang-format $base"
          echo
          echo "$out"
          exit 1

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            build_type: Debug
            coverage: true
            integration: true
          - os: ubuntu-latest
            build_type: Release
            coverage: false
            integration: false
          # macOS
          - os: macos-latest
            build_type: Debug
            coverage: false
            integration: true
          - os: macos-latest
            build_type: Release
            coverage: false
            integration: false
          # Windows
          - os: windows-latest
            build_type: Debug
            coverage: false
            integration: true
          - os: windows-latest
            build_type: Release
            coverage: false
            integration: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Linux dependencies ──
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libfftw3-dev \
            libboost-all-dev \
            libhdf5-dev \
            libgsl-dev \
            libcgal-dev
          # Coverage tools
          if [ "${{ matrix.coverage }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends lcov
          fi

      # ── macOS dependencies ──
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            fftw \
            boost \
            hdf5 \
            gsl \
            cgal
          echo "BOOST_ROOT=$(brew --prefix boost)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix boost)" >> $GITHUB_ENV

      # ── Windows dependencies (vcpkg) ──
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install fftw3:x64-windows pthreads:x64-windows \
            boost-thread:x64-windows boost-date-time:x64-windows \
            boost-regex:x64-windows boost-filesystem:x64-windows \
            boost-system:x64-windows boost-chrono:x64-windows \
            boost-program-options:x64-windows boost-signals2:x64-windows \
            boost-format:x64-windows boost-property-tree:x64-windows \
            boost-algorithm:x64-windows boost-asio:x64-windows \
            boost-any:x64-windows boost-array:x64-windows \
            boost-dynamic-bitset:x64-windows boost-exception:x64-windows \
            boost-foreach:x64-windows boost-function:x64-windows \
            boost-lambda:x64-windows boost-lexical-cast:x64-windows \
            boost-multi-array:x64-windows boost-optional:x64-windows \
            boost-smart-ptr:x64-windows boost-tuple:x64-windows \
            boost-utility:x64-windows \
            hdf5:x64-windows gsl:x64-windows cgal:x64-windows

      # ── Configure (Unix) ──
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          integration_tests=OFF
          if [ "${{ matrix.integration }}" = "true" ]; then
            integration_tests=ON
          fi
          cmake_args=(
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
            -DF2DOCK_BUILD_INTEGRATION_TESTS=${integration_tests}
          )
          if [ "${{ matrix.coverage }}" = "true" ]; then
            # F2Dock's CMakeLists.txt overwrites CMAKE_CXX_FLAGS via set(),
            # so we inject coverage flags through CPPFLAGS/LDFLAGS env vars
            # which the CMakeLists.txt already picks up via $ENV{CPPFLAGS}.
            export CPPFLAGS="--coverage -fprofile-arcs -ftest-coverage"
            export LDFLAGS="--coverage"
          fi
          cmake "${cmake_args[@]}"

      # ── Configure (Windows) ──
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          integration_tests=OFF
          if [ "${{ matrix.integration }}" = "true" ]; then
            integration_tests=ON
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DF2DOCK_BUILD_INTEGRATION_TESTS=${integration_tests} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      # ── Build ──
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ──
      - name: Run unit tests
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel 4 -LE integration

      - name: Run integration tests
        if: matrix.integration
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --parallel 1 -L integration

      # ── Coverage (Linux Debug only) ──
      - name: Generate coverage report
        if: matrix.coverage
        run: |
          lcov --directory build --capture --output-file build/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage.info \
            '/usr/*' \
            '*/test/*' \
            '*/tests/*' \
            '*/_deps/*' \
            --output-file build/coverage_filtered.info \
            --ignore-errors unused
          genhtml build/coverage_filtered.info \
            --output-directory build/coverage_html \
            --title "F2Dock Code Coverage" \
            --legend \
            --demangle-cpp \
            --ignore-errors source

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # ── Verify executables (Unix) ──
      - name: Verify executables exist (Unix)
        if: runner.os != 'Windows'
        run: |
          test -x build/bin/F2Dock
          test -x build/bin/GB-Rerank
          test -x build/bin/F2DockServer
          test -x build/bin/FilterOutput
          echo "All 4 executables built successfully"

      # ── Verify executables (Windows) ──
      - name: Verify executables exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exes = @("F2Dock.exe", "GB-Rerank.exe", "FilterOutput.exe")
          foreach ($exe in $exes) {
            $path = "build/bin/${{ matrix.build_type }}/$exe"
            if (-not (Test-Path $path)) {
              $path = "build/bin/$exe"
            }
            if (-not (Test-Path $path)) {
              Write-Error "$exe not found"
              exit 1
            }
            Write-Host "Found: $path"
          }
          Write-Host "All 3 Windows executables built successfully"

      # ── Upload build artifacts ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/bin/
            build/lib/
          retention-days: 14
